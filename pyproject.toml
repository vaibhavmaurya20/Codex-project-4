[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-omega"
version = "2.1.0"
description = "AEGIS-Ω v2.1 Production-Practical Edition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
cloud = ["httpx>=0.27"]
vector = ["numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aegis-omega = "aegis_omega.main:main"

[tool.setuptools.packages.find]
include = ["aegis_omega*"]
